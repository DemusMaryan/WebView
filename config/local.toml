# Native WSL only. User traffic is HTTPS; HTTP only redirects GET/HEAD.
[paths]
cv_root = "~/.local/share/monotrajectoryweb"
data_root = "~/.local/share/monotrajectoryweb/web"

[ports]
postgres = 55432
api = 8000
entry = 8080
https = 8443
balancer = 8081
compute_1 = 8101
compute_2 = 8102

[limits]
file_bytes = 67108864
duration_seconds = 40.0
frames = 1200
width = 1280
height = 720
execution_seconds = 180.0
stored_jobs = 100
queued_jobs = 10
snapshot_points = 256
snapshot_trajectory = 240
snapshot_interval_seconds = 0.5

[storage]
# The current Ubuntu VHDX is backed by C:. Change this if the distro is moved.
backing_mount = "/mnt/c"
native_reserve_bytes = 2147483648
backing_reserve_bytes = 5368709120

[auth]
cookie_mode = "https"
allowed_origins = ["https://127.0.0.1:8443"]
session_seconds = 28800
preauth_seconds = 600

[tls]
canonical_origin = "https://127.0.0.1:8443"
trusted_proxy_addresses = ["127.0.0.1"]

[queue]
# Estimated worker wall time (decode + native + export/cleanup), never queue time.
initial_seconds = 45.0
reference_frames = 360
reference_width = 640
reference_height = 480
history_samples = 30
